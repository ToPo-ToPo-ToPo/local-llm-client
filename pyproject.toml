[project]
name = "local-llm-client"
version = "0.10.1"
description = "ローカル LLM ゲートウェイ（local-llm-server / OpenAI 互換）に繋ぐ高レベルクライアント。エージェント共通のクライアントで、openai のボイラープレートを再実装しない（chat・画像・動画・音声認識/STT）。"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ToPo-ToPo-ToPo" }]
keywords = ["llm", "openai", "client", "local-llm", "gateway", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Operating System :: OS Independent",
]
# 公式 openai SDK を土台にする（自動リトライ・型付き応答・ツール呼び出し/構造化出力）。
# サーバー（ゲートウェイ）は別パッケージ local-llm-server。本パッケージは接続のみ。
# import するのは openai だけ（HTTP 層は openai.Timeout / TIMEOUT_ERRORS 越しに扱い、httpx /
# httpx2 は直接 import しない。openai 3.0 で httpx → httpx2 に替わったため）。版の範囲は
# scripts/check-fresh-venv.sh で空の venv に入れて確かめた範囲に合わせる:
#   下限 1.55.3: それより前の openai は httpx 0.28 に無い proxies= を渡し、空の環境（httpx は最新が
#                入る）ではクライアントを作れない。
#   上限 <4:     3.0 のように次のメジャーで HTTP 層が替わっても黙って壊れないよう、確かめた
#                メジャー（1〜3）に留める。4.x が出たら同じ手順で確かめてから広げる。
dependencies = [
    "openai>=1.55.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/ToPo-ToPo-ToPo/local-llm-client"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_llm_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
